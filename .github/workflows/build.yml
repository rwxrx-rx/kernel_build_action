# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/rwxrx-rx/android_kernel_xiaomi_camellia
          kernel-dir: camellia
          kernel-branch: lineage-23.2
          config: camellia_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: false
          ksu-version: main
          android-version: 16
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
